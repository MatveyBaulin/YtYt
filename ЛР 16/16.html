<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай число</title>
    <link rel="stylesheet" href="./pages/CSS/16.css">
</head>
<body>
    <div class="container">
        <h1>Угадай число!</h1>
        <p>Я загадал число от 1 до <span id="range">100</span>.</p>
        <p>Попробуй угадать!</p>

        <input type="number" id="guessInput" placeholder="Ваше предположение">
        <button id="guessButton">Проверить</button>
        <div id="feedback"></div>
        <div id="gameInfo"></div>
        <button id="restartButton">Начать заново</button>
    </div>
    <script src="./pages/JavaScript/16.js"></script>
</body>
</html>
