<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма Регистрации</title>
    <link href="./pages/CSS/YtYt.css" rel="stylesheet">
    <link href="./pages/CSS/registration.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Gilroy';
            src: url('./pages/fonts/Gilroy-Light.otf') format('opentype');
            font-weight: 300;
            font-style: normal;
        }

        /* Немного стилей для отображения элементов */
        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-container container">
            <img class="logo" src="./pages/IMG/logo.svg" alt="Логотип" />
            <p id="date"></p>
            <nav class="nav-menu">
                <a href="index.html">На главную</a>
            </nav>
        </div>
    </header>
    <main class="container" style="max-width: 600px; margin: 40px auto;">
        <h1 style="text-align: center; font-weight: 600; margin-bottom: 30px;">Регистрация</h1>
        <form id="registration-form">
            <label for="username">Имя пользователя:</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="15"
                pattern="^[a-zA-Z0-9_]+$" title="От 3 до 15 символов: латинские буквы, цифры, символ '_'">

            <!-- Email: тип = email, браузер проверит «@» и домен -->
            <label for="email">Электронная почта:</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com">

            <!-- Пароль: минимум 8 символов, минимум одна цифра и одна буква -->
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required minlength="8"
                pattern="(?=.*[0-9])(?=.*[a-zA-Z]).{8,}"
                title="Не менее 8 символов, минимум одна цифра и одна буква">

            <!-- Пол -->
            <fieldset>
                <legend>Пол (обязательно)</legend>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Мужской</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Женский</label>
            </fieldset>

            <!-- Навыки – пользователь может выбрать минимум один -->
            <fieldset>
                <legend>Навыки (выберите хотя бы один)</legend>
                <input type="checkbox" id="skill-html" name="skills" value="HTML" required>
                <label for="skill-html">HTML</label>

                <input type="checkbox" id="skill-css" name="skills" value="CSS">
                <label for="skill-css">CSS</label>

                <input type="checkbox" id="skill-js" name="skills" value="JavaScript">
                <label for="skill-js">JavaScript</label>
            </fieldset>

            <!-- Страна -->
            <label for="country">Страна:</label>
            <select id="country" name="country" required>
                <option value="">— выберите —</option>
                <option value="russia">Россия</option>
                <option value="usa">США</option>
                <option value="canada">Канада</option>
                <option value="uk">Великобритания</option>
            </select>

            <button type="submit">Отправить</button>
        </form>
    </main>
    <script src="./pages/JavaScript/registration.js"></script>
</body>
</html>
